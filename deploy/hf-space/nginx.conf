# Public front for the read-only demo. start.sh fills in __SECRET__ and __GUEST__.
# Every request reaches the studio as the demo guest; whatever identity headers a client sends are replaced.
# The guest is a crew member so the studio shows its full composer (the compiled-prompt preview is only built
# for members who may write). This file is the read-only boundary: it passes reads and the few POSTs the studio
# answers without writing (previews in a rolled-back transaction, writing search/compare/export), and refuses
# every other write.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 64k;

    map "$request_method:$uri" $demo_allowed {
        default 0;
        "~^(GET|HEAD):" 1;
        "~^POST:/aivideo/open/v1/shots/[^/]+/prompt-previews/?$" 1;
        "~^POST:/aivideo/open/v1/episodes/[^/]+/(script-impact|storyboard-estimates)/?$" 1;
        # The writing workspace treats these POSTs as reads (project_docs/writing_http.py, readonly).
        "~^POST:/aivideo/open/v1/episodes/[^/]+/writing/(search|compare|exports)/?$" 1;
    }
    # Every visitor arrives through the same Space proxy, so the preview limit is shared.
    limit_req_zone $server_name zone=previews:1m rate=5r/s;

    server {
        listen 7860;
        # Behind the Space proxy the public port is not 7860, so redirects stay relative.
        absolute_redirect off;

        location = / {
            return 302 /projects/;
        }

        # External agents connect on their own machine, never through the demo.
        location /mcp {
            return 404;
        }

        location / {
            default_type application/json;
            if ($demo_allowed = 0) {
                return 403 '{"code":403,"msg":"This is a read-only demo: nothing can be changed or generated here. Run ZeroField on your own GPU to make films.","error":"This is a read-only demo: nothing can be changed or generated here. Run ZeroField on your own GPU to make films.","data":null}';
            }
            limit_req zone=previews burst=20 nodelay;
            proxy_pass http://127.0.0.1:3020;
            proxy_http_version 1.1;
            # The studio checks a POST's Origin against Host, so the public host must pass through.
            proxy_set_header Host $http_host;
            proxy_set_header X-OpenBench-Proxy-Secret "__SECRET__";
            proxy_set_header X-OpenBench-Actor "__GUEST__";
            proxy_set_header Cookie "";
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
