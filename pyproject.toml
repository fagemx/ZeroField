[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench"
version = "0.2.0"
description = "Collaborative documents, production sheets and durable AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psycopg[binary]>=3.2,<4", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "Pillow>=11,<13", "pypdf>=6,<7"]

[project.optional-dependencies]
comfy = ["comfy-sdk>=0.5,<0.6", "comfy-api-proxy>=0.1.6,<0.2"]
embedded = ["pgserver>=0.1.4,<0.2"]
fidelity = ["opencv-python-headless>=4.8,<5", "numpy>=1.26"]

[project.scripts]
zerofield-studio = "run_studio:main"
openbench = "server:main"
openbench-worker = "project_assistant.limb_worker:main"
zerofield-mcp = "project_assistant.zerofield_mcp:main"

[tool.setuptools]
py-modules = ["server", "run_studio"]
packages = ["project_docs", "project_assistant", "project_assistant.studio", "openbench_data"]
include-package-data = false

[tool.setuptools.package-data]
project_assistant = ["prompts/*.md", "provider_catalog.json", "mcp_cards/*.html"]
openbench_data = ["db/*.sql", "static/projects/*", "static/projects/assets/*", "workflows/*.json", "workflows/*.md", "workflows/cards/*.json", "workflows/router/*.json", "samples/*.png", "samples/*.mp4", "samples/*.md", "samples/*.py", "skills/*.md", "skills/*/*.md"]
