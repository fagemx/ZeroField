[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench"
version = "0.2.0"
description = "Collaborative documents, production sheets and durable AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psycopg[binary]>=3.2,<4", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "Pillow>=11,<13", "pypdf>=6,<7"]

[project.optional-dependencies]
embedded = ["pgserver>=0.1.4,<0.2"]

[project.scripts]
openbench = "server:main"
openbench-worker = "project_assistant.limb_worker:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["project_docs", "project_assistant", "openbench_data"]
include-package-data = false

[tool.setuptools.package-data]
project_assistant = ["prompts/*.md"]
openbench_data = ["db/*.sql", "static/projects/*", "static/projects/assets/*"]
